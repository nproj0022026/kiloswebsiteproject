<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Home - K.I.L.O.S.</title>
<link rel="icon" type="image/png" href="assets/logo/kilos-logo.png">

<!-- Tailwind CDN (must load before scripts/main.js, which sets tailwind.config) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<!-- Project styles & scripts -->
<link rel="stylesheet" href="styles/main.css">
<script src="scripts/main.js"></script>
<script src="scripts/pages/about.js"></script>
<script src="scripts/pages/tracker.js"></script>
<script src="scripts/pages/faq.js"></script>
</head>
<body class="bg-background text-on-background antialiased font-body-md text-body-md pb-[70px] md:pb-0">

<!-- Shared TopAppBar (rendered once by scripts/main.js -> renderHeader). -->
<div id="site-header" class="contents"></div>

<!-- THE ROUTER TARGET. Only this element's innerHTML changes on navigation. -->
<main id="page-content" class="w-full max-w-[1850px] mx-auto px-container-margin py-stack-lg flex flex-col gap-stack-lg"></main>

<!-- Shared BottomNavBar, mobile only -->
<div id="site-bottom-nav"></div>

<!-- Welcome Modal (first-visit name capture) — shared chrome, lives in the shell -->
<div id="welcome-modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-on-surface/40 backdrop-blur-sm hidden">
  <div class="bg-surface p-8 rounded-xl shadow-xl max-w-[400px] w-[90%] flex flex-col gap-6 border border-outline-variant">
    <div class="flex flex-col gap-2">
      <h2 class="font-headline-md text-headline-md text-on-surface">Welcome to K.I.L.O.S.</h2>
      <p class="font-body-md text-on-surface-variant"><span data-modal-greeting>Magandang araw!</span> Let us know your name so we can personalize your experience and greet you on your BP Tracker.</p>
    </div>
    <div class="flex flex-col gap-2">
      <label for="user-name-input" class="font-label-caps text-label-caps text-primary">Your Name</label>
      <div class="relative">
        <input type="text" id="user-name-input" placeholder="e.g. Juan" class="w-full p-3 pr-10 rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all   bg-surface-container-low">
        <button type="button" id="clear-name-btn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1" aria-label="Clear name">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>
    </div>
    <div class="flex flex-col gap-3">
      <button id="modal-ok-btn" class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-4 rounded-lg hover:bg-secondary transition-colors focus:ring-4 focus:ring-primary/50">OK</button>
      <button id="modal-skip-btn" class="w-full text-on-surface-variant font-label-caps text-label-caps py-2 hover:text-primary transition-colors">Skip</button>
    </div>
  </div>
</div>

</body>
</html>
